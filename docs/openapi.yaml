

openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    Це API для управління контактами користувачів, з авторизацією, email-інтеграцією та завантаженням фото.

tags:
  - name: Contacts
    description: Операції з контактами користувачів
  - name: Auth
    description: Операції авторизації

servers:
  
  - url: https://nodejs-hw-mongodb-73n3.onrender.com

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

  /auth/register:
    $ref: '../swagger/paths/auth/register.yaml'

  /auth/login:
    $ref: '../swagger/paths/auth/login.yaml'

  /auth/refresh:
    $ref: '../swagger/paths/auth/refresh.yaml'

  /auth/logout:
    $ref: '../swagger/paths/auth/logout.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
