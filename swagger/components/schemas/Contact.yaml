

type: object
properties:
  _id:
    type: string
    example: 6123456789abcdef01234567
  name:
    type: string
    example: Ivan Petrov
  phoneNumber:
    type: string
    example: "+380501234567"
  email:
    type: string
    example: ivan@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    example: work
  photo:
    type: string
    example: https://res.cloudinary.com/example/image/upload/v123/photo.jpg
  userId:
    type: string
    example: 6123456789abcdef01234567
  createdAt:
    type: string
    format: date-time
    example: "2025-04-10T12:00:00.000Z"
  updatedAt:
    type: string
    format: date-time
    example: "2025-04-10T12:00:00.000Z"
