tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get a list of all contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number for pagination

  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
    description: Number of contacts per page

  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email]
    description: Sort by name or email in ascending order

  - name: sortByDesc
    in: query
    required: false
    schema:
      type: string
      enum: [name, email]
    description: Sort by name or email in descending order

  - name: filter
    in: query
    required: false
    schema:
      type: string
      example: ""
    description: Fields to include in response, separated by |

responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 2
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: false

  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
