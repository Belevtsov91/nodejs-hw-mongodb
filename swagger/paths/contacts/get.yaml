tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Get a list of all contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
    description: Page number for pagination
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      default: 20
    description: Number of contacts per page
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, createdAt]
    description: Field to sort by (ascending)
  - name: sortByDesc
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, createdAt]
    description: Field to sort by (descending)
  - name: filter
    in: query
    required: false
    schema:
      type: string
    description: Fields to include in response, separated by |
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                total:
                  type: integer
                  example: 100
                limit:
                  type: integer
                  example: 20
                page:
                  type: integer
                  example: 1
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
