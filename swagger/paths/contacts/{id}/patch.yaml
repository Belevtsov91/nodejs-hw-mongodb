tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Update an existing contact. Requires authentication and optionally accepts a new photo.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Jane Doe
          phoneNumber:
            type: string
            example: +380123456789
          email:
            type: string
            example: jane@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            example: personal
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary

responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact!
            data:
              $ref: ../../../components/schemas/Contact.yaml

  '400':
    description: Invalid input (e.g. unsupported photo file format)
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid file format. Only .jpg, .png are allowed.
            data:
              anyOf:
                - type: string
                - type: "null"
              example: null

  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Error.yaml
